{% extends "tracker/base.html" %}
{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-8">
    <div id="map" style="height:70vh" class="border rounded"></div>
  </div>
  <div class="col-lg-4">
    <h5>Live vehicles</h5>
    <table class="table table-sm" id="vtable"><thead><tr><th>Plate</th><th>Status</th><th>Speed</th></tr></thead><tbody></tbody></table>
    <h5>Recent alerts</h5>
    <ul class="list-group">
      {% for a in alerts %}
      <li class="list-group-item list-group-item-warning"><strong>{{ a.alert_type }}</strong><br>{{ a.message }}<br><small>{{ a.timestamp }}</small></li>
      {% empty %}<li class="list-group-item">No alerts.</li>{% endfor %}
    </ul>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([7.4443, 3.9000], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
const markers = {};
let fitted = false;
async function refresh() {
  const res = await fetch("{% url 'api_vehicles' %}");
  const data = await res.json();
  const tbody = document.querySelector('#vtable tbody'); tbody.innerHTML = '';
  data.vehicles.forEach(v => {
    const colour = v.status === 'In-Use' ? 'green' : 'gray';
    if (!markers[v.plate]) markers[v.plate] = L.circleMarker([v.lat, v.lon], {radius: 9}).addTo(map);
    markers[v.plate].setLatLng([v.lat, v.lon]).setStyle({color: colour, fillColor: colour, fillOpacity: .8})
      .bindPopup(`${v.plate}<br>${v.speed} km/h`);
    tbody.insertAdjacentHTML('beforeend', `<tr><td>${v.plate}</td><td>${v.status}</td><td>${v.speed}</td></tr>`);
  });
  if (!fitted && data.vehicles.length) {
  map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.3), {maxZoom: 15});
  fitted = true;
 }
}
refresh(); setInterval(refresh, 5000);
</script>
{% endblock %}
