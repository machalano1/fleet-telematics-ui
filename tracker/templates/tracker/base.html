<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fleet Telematics{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3"><div class="container-fluid">
  <span class="navbar-brand">Fleet Telematics &middot; University of Ibadan</span>
  <div>
    <a class="btn btn-sm btn-outline-light" href="{% url 'dashboard' %}">Dashboard</a>
    <a class="btn btn-sm btn-outline-light" href="{% url 'report' %}">Reports</a>
    <a class="btn btn-sm btn-outline-light" href="{% url 'admin:index' %}">Admin</a>
    <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
      <button class="btn btn-sm btn-light">Log out</button></form>
  </div>
</div></nav>
<div class="container-fluid">{% block content %}{% endblock %}</div>
</body>
</html>
